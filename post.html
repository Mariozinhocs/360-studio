<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - 360° Studio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0b0e;
            --bg-card: rgba(16, 18, 26, 0.65);
            --border-glass: rgba(255, 255, 255, 0.07);
            --text-primary: #f5f6f9;
            --text-secondary: #8f9cae;
            --color-accent: #00f2fe;
            --color-accent-hover: #4facfe;
            --color-purple: #9b51e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.8;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 242, 254, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(155, 81, 224, 0.04) 0%, transparent 40%);
        }

        header {
            border-bottom: 1px solid var(--border-glass);
            background: rgba(10, 11, 14, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 22px;
        }

        .logo i {
            color: var(--color-accent);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .logo .highlight {
            background: linear-gradient(135deg, var(--color-accent), var(--color-accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            padding: 8px 16px;
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
        }

        .back-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .article-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .post-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .post-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 500;
        }

        .post-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .post-author-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .post-author-box strong {
            color: #fff;
        }

        .post-cover {
            width: 100%;
            height: 400px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            margin-bottom: 40px;
            background: #111;
        }

        .post-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-body {
            font-size: 16px;
            color: #e2e8f0;
            line-height: 1.8;
        }

        .post-body p {
            margin-bottom: 24px;
        }

        .post-body strong {
            color: #fff;
        }

        .post-body h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            color: #fff;
            margin-top: 40px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .post-body ul {
            margin-bottom: 24px;
            padding-left: 20px;
        }

        .post-body li {
            margin-bottom: 10px;
        }

        .loading-box {
            text-align: center;
            padding: 100px 0;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loading-box i {
            font-size: 32px;
            color: var(--color-accent);
        }

        footer {
            text-align: center;
            padding: 40px 24px;
            border-top: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 80px;
            background: rgba(10, 11, 14, 0.4);
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="home.html" class="logo">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 360°<span class="highlight">Studio</span>
            </a>
            <a href="blog.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Blog
            </a>
        </div>
    </header>

    <main class="article-container" id="post-container">
        <div class="loading-box" id="loading-box">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <span>Carregando artigo...</span>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 360° Studio. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("post-container");
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get("id");

            if (!postId) {
                renderError("Artigo não especificado.");
                return;
            }

            try {
                const res = await fetch("api/blog_posts.json");
                if (!res.ok) throw new Error("Erro ao carregar os dados.");
                const posts = await res.json();

                const post = posts.find(p => p.id === postId);

                if (!post) {
                    renderError("Desculpe, o artigo que você procura não foi encontrado.");
                    return;
                }

                // Atualizar título da aba do navegador
                document.title = `${post.title} - 360° Studio Blog`;

                container.innerHTML = `
                    <article>
                        <div class="post-header">
                            <div class="post-meta">
                                <span><i class="fa-regular fa-calendar"></i> ${post.date}</span>
                                <span><i class="fa-regular fa-clock"></i> ${post.readTime}</span>
                            </div>
                            <h1>${post.title}</h1>
                            <div class="post-author-box">
                                Escrito por <strong>${post.author}</strong>
                            </div>
                        </div>
                        <div class="post-cover">
                            <img src="${post.cover}" alt="${post.title}">
                        </div>
                        <div class="post-body">
                            ${post.content}
                        </div>
                    </article>
                `;
            } catch (err) {
                console.error(err);
                renderError("Falha na conexão ao carregar o artigo.");
            }

            function renderError(message) {
                container.innerHTML = `
                    <div class="loading-box">
                        <i class="fa-solid fa-circle-exclamation" style="color: #ff3366;"></i>
                        <span style="font-size: 16px; font-weight: 500; color: #fff; margin-bottom: 15px;">${message}</span>
                        <a href="blog.html" class="back-btn" style="display: inline-flex;"><i class="fa-solid fa-arrow-left"></i> Voltar ao Blog</a>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
