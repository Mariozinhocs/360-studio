<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - 360° Studio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body class="auth-page">
    <div class="auth-background-effects">
        <div class="glow-sphere sphere-1"></div>
        <div class="glow-sphere sphere-2"></div>
    </div>

    <div class="auth-container">
        <!-- LOGO -->
        <div class="auth-logo">
            <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
            <span class="logo-text">360°<span class="highlight">Studio</span></span>
            <p class="subtitle">A-Team Tour Platform</p>
        </div>

        <!-- CARD LOGIN -->
        <div class="auth-card glassmorphism active" id="login-card">
            <h2>Bem-vindo de volta</h2>
            <p class="auth-subtitle">Acesse seus projetos de Tour Virtual 360°</p>

            <div id="login-form">
                <!-- Inputs falsos invisíveis para capturar o preenchimento automático do navegador -->
                <input type="text" name="fake_username_autofill" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px;" tabindex="-1" autocomplete="off" />
                <input type="password" name="fake_password_autofill" style="position: absolute; top: -9999px; left: -9999px; width: 1px; height: 1px;" tabindex="-1" autocomplete="off" />

                <div class="form-group">
                    <label for="login-username"><i class="fa-regular fa-circle-user"></i> Usuário ou E-mail</label>
                    <input type="text" id="login-username" required placeholder="Nome de usuário ou e-mail">
                </div>
                <div class="form-group">
                    <label for="login-password"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="button" id="btn-login-submit" class="btn btn-primary btn-block">
                    <span>Entrar na Plataforma</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </div>
            <div class="auth-footer">
                <span>Novo por aqui? <a href="#" id="link-show-register">Crie uma conta gratuita</a></span>
            </div>
        </div>

        <!-- CARD CADASTRO -->
        <div class="auth-card glassmorphism" id="register-card">
            <h2>Criar sua conta</h2>
            <p class="auth-subtitle">Comece a criar seus passeios 3D interativos hoje</p>

            <div id="register-form">
                <div class="form-group">
                    <label for="register-name"><i class="fa-regular fa-user"></i> Nome Completo</label>
                    <input type="text" id="register-name" required placeholder="Ex: Nome Nome">
                </div>
                <div class="form-group">
                    <label for="register-username"><i class="fa-regular fa-circle-user"></i> Nome de Usuário</label>
                    <input type="text" id="register-username" required placeholder="Ex: nome_nome" pattern="^[a-zA-Z0-9_]{3,30}$" title="De 3 a 30 caracteres alfanuméricos e underscores.">
                </div>
                <div class="form-group">
                    <label for="register-email"><i class="fa-regular fa-envelope"></i> E-mail</label>
                    <input type="email" id="register-email" required placeholder="seuemail@exemplo.com">
                </div>
                <div class="form-group">
                    <label for="register-password"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="register-password" required minlength="6" placeholder="(mín. 6 caracteres)">
                </div>
                <button type="button" id="btn-register-submit" class="btn btn-accent btn-block">
                    <span>Criar Conta & Iniciar Teste</span> <i class="fa-solid fa-rocket animate-pulse"></i>
                </button>
            </div>
            <div class="auth-footer">
                <span>Já possui conta? <a href="#" id="link-show-login">Faça login</a></span>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <script>
        // Limpar preenchimento automático indesejado do navegador no carregamento inicial
        const clearAutofillFields = () => {
            const u = document.getElementById('login-username');
            const p = document.getElementById('login-password');
            if (u && u.value && document.activeElement !== u) u.value = '';
            if (p && p.value && document.activeElement !== p) p.value = '';
        };
        // Executa em múltiplos intervalos para cobrir o atraso de preenchimento de extensões/navegadores
        [50, 150, 300, 600, 1000].forEach(delay => {
            setTimeout(clearAutofillFields, delay);
        });

        // Sincronizar Toasts
        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            let iconClass = "fa-info-circle";
            if (type === "success") iconClass = "fa-check-circle";
            if (type === "error") iconClass = "fa-exclamation-circle";
            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add("show"), 10);
            setTimeout(() => {
                toast.classList.remove("show");
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }

        // Toggles entre Login e Cadastro
        const loginCard = document.getElementById('login-card');
        const registerCard = document.getElementById('register-card');
        const linkShowRegister = document.getElementById('link-show-register');
        const linkShowLogin = document.getElementById('link-show-login');

        linkShowRegister.addEventListener('click', (e) => {
            e.preventDefault();
            loginCard.classList.remove('active');
            registerCard.classList.add('active');
        });

        linkShowLogin.addEventListener('click', (e) => {
            e.preventDefault();
            registerCard.classList.remove('active');
            loginCard.classList.add('active');
        });


        // Submeter Formulário de Login
        const submitLogin = async () => {
            const usernameOrEmail = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            if (!usernameOrEmail || !password) {
                showToast('Por favor, preencha todos os campos.', 'error');
                return;
            }

            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username_or_email: usernameOrEmail, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showToast('Login efetuado! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showToast(data.message || 'Erro ao efetuar login.', 'error');
                }
            } catch (err) {
                showToast('Erro ao comunicar com o servidor.', 'error');
            }
        };

        // Submeter Formulário de Cadastro
        const submitRegister = async () => {
            const name = document.getElementById('register-name').value;
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            if (!name || !username || !email || !password) {
                showToast('Por favor, preencha todos os campos.', 'error');
                return;
            }

            try {
                const res = await fetch('api/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, username, email, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    showToast('Cadastro concluído com sucesso! Redirecionando...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } else {
                    showToast(data.message || 'Erro ao efetuar cadastro.', 'error');
                }
            } catch (err) {
                showToast('Erro ao comunicar com o servidor.', 'error');
            }
        };

        // Eventos de clique nos botões
        document.getElementById('btn-login-submit').addEventListener('click', submitLogin);
        document.getElementById('btn-register-submit').addEventListener('click', submitRegister);

        // Suporte ao clique na tecla Enter para submissão
        const addEnterSubmit = (inputId, action) => {
            const el = document.getElementById(inputId);
            if (el) {
                el.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        action();
                    }
                });
            }
        };

        addEnterSubmit('login-username', submitLogin);
        addEnterSubmit('login-password', submitLogin);
        addEnterSubmit('register-name', submitRegister);
        addEnterSubmit('register-username', submitRegister);
        addEnterSubmit('register-email', submitRegister);
        addEnterSubmit('register-password', submitRegister);
    </script>
</body>
</html>
